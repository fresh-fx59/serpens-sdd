# Publish @fresh-fx59/serpens-sdd to npm via OIDC trusted publishing.
#
# There is no credential in this file, and none in the repository's secrets. npm mints a
# short-lived token from the OIDC identity this job requests, which is why `id-token: write`
# below is load-bearing rather than boilerplate. Requirements come from npm's trusted-publishers
# documentation: npm >= 11.5.1, Node >= 22.14.0, and a trusted publisher configured on the
# package's settings page naming this repository AND this file's NAME — `publish.yml`. Renaming
# this file silently breaks the publisher configuration, so do not rename it.
#
# The job refuses to publish unless BOTH hold:
#   1. the pushed tag equals package.json's version AND editionToSemver(serpensSddEdition);
#   2. `node scripts/release.mjs` completed — it restamps both kit trees, runs the shell
#      acceptance suites and the bin parity gate, rebuilds the zips, verifies every manifest,
#      re-syncs the vendored kits, regenerates the port registry and runs the package's own
#      suite. Without it a tag can publish a stale but internally consistent kit, and every
#      test in the package still passes.
name: publish

# TAG ONLY. Never a branch: a branch filter would publish on every merge, and npm's unpublish
# window is 72 hours — a mistaken publish is effectively permanent.
on:
  push:
    tags:
      - 'v1.*'
      - '1.*'

permissions:
  # id-token is the ONLY credential path: an OIDC token minted per run, never stored anywhere.
  # contents stays read-only — a publish job has no business writing to the repository.
  id-token: write
  contents: read

# THE PATH SHIFT, stated where it bites. This file lives at the REPOSITORY ROOT's
# .github/workflows/publish.yml. The package itself lives one level down, in `npm/`, with the
# two kit trees (`en/`, `ru/`) and the shell acceptance suites (`tests/`) as its siblings at the
# repository root — which is precisely the "one level up" layout scripts/release.mjs and
# scripts/kit-source.mjs resolve against. So every `run:` step must execute inside `npm/`.
defaults:
  run:
    working-directory: npm

jobs:
  publish:
    runs-on: ubuntu-latest
    # release.mjs's gen-ports.mjs step shells out to `npx` against ~40 real agent-CLI packages
    # and takes ~20 minutes on its own; the shell suites, the zip rebuild and the package suite
    # add a few more. 75 minutes leaves real headroom for a slow registry while still killing a
    # hung probe long before the 6-hour default would.
    timeout-minutes: 75

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the parity suite inside release.mjs resolves its reference bytes from
          # git history rather than the working tree, so a shallow clone blinds it.
          fetch-depth: 0

      - name: Install ripgrep and PyYAML
        # tests/starter-contract-test.sh shells out to `rg` directly — it is not an npm
        # dependency, so `npm ci` can never provide it. The ubuntu-latest image does not carry
        # it by default; without this step the starter-contract suite fails every `rg` call as
        # a bare "command not found" and the release pipeline never gets past step 9.
        #
        # python3-yaml (PyYAML): test/openspec-config.test.mjs's assertValidYaml helper shells
        # out to `python3 -c "import yaml; ..."` to independently verify the config-editing code
        # under test produces real, parseable YAML — deliberately a second parser, not the same
        # JS library the production code uses. Found 2026-09-23 reproducing a CI-only failure in
        # a matching ubuntu-bookworm container: 17 tests failed with
        # `ModuleNotFoundError: No module named 'yaml'` because the bare Node.js Docker/runner
        # image ships python3 without it. It is an on-disk fixture-verification dependency, not
        # a package dependency, so nothing in package.json could have caught its absence.
        run: sudo apt-get update && sudo apt-get install -y ripgrep python3-yaml

      - name: Install lefthook
        # An installed `lefthook` binary is exercised for real by test/stage6.test.mjs, the
        # store-uninstall e2e suite and the coexistence gap tests — they shell out to the actual
        # CLI (`lefthook install`, `lefthook version`) rather than a stub, on purpose, so a git
        # hook wiring bug shows up against the real tool. Found 2026-09-23 the same way as the
        # PyYAML gap above: reproducing this workflow's failure in a matching container showed
        # every one of these tests dying on a bare "lefthook: command not found" — the
        # ubuntu-latest image does not carry it, and nothing before this fix ever installed it in
        # CI. `npm install -g lefthook` is npm's own documented install path and needs no
        # apt repository.
        run: npm install -g lefthook

      - name: Configure a git identity for this runner
        # test/e2e.test.mjs exercises src/storeregistry.mjs's real store-registration commit
        # (`git commit -m "chore(serpens-sdd): commit store identity metadata"`) against a
        # throwaway store it clones from a fixture remote — that clone inherits whatever git
        # identity is ambient in the environment, same as a real user's store would on their own
        # machine. Every developer machine this has ever been tested on already has one; a bare
        # ubuntu-latest runner does not, so the commit dies with "Author identity unknown" and
        # `npm test` (release.mjs step 19) never gets past this one e2e case. This is the CI
        # equivalent of "make sure git is configured" — not a workaround in test code, since the
        # commit itself is real, shipped production behavior being exercised faithfully.
        run: |
          git config --global user.email "ci@serpens-sdd.invalid"
          git config --global user.name "serpens-sdd CI"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          # No `registry-url:` on purpose. That input makes setup-node write an .npmrc with an
          # auth line bound to an environment token — the exact credential shape trusted
          # publishing exists to remove. The default registry is registry.npmjs.org already.

      - name: Install an npm that can do trusted publishing
        # The npm bundled with a Node 22 image predates OIDC publishing. Requesting a version is
        # not the same as having one, which is what the next step is for.
        run: npm install --global npm@^11.5.1

      - name: Assert the RESOLVED Node and npm versions meet the floors
        # Asserts what is actually in PATH, not what the steps above asked for. Without this, an
        # older resolved npm reaches the publish step and fails there — after ~20 minutes of
        # pipeline — with an authentication error that names none of this as the cause.
        run: |
          set -euo pipefail
          NODE_FLOOR=22.14.0
          NPM_FLOOR=11.5.1
          NODE_HAVE="$(node -v | sed 's/^v//')"
          NPM_HAVE="$(npm -v)"
          echo "resolved node=$NODE_HAVE (floor $NODE_FLOOR), npm=$NPM_HAVE (floor $NPM_FLOOR)"
          # `sort -V` puts the lower version first; if the floor is not the lowest of the pair,
          # what we have is older than the floor.
          if [ "$(printf '%s\n%s\n' "$NODE_FLOOR" "$NODE_HAVE" | sort -V | head -n1)" != "$NODE_FLOOR" ]; then
            echo "::error::node $NODE_HAVE is older than the required $NODE_FLOOR — OIDC trusted publishing needs $NODE_FLOOR or newer"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$NPM_FLOOR" "$NPM_HAVE" | sort -V | head -n1)" != "$NPM_FLOOR" ]; then
            echo "::error::npm $NPM_HAVE is older than the required $NPM_FLOOR — OIDC trusted publishing needs $NPM_FLOOR or newer"
            exit 1
          fi

      - name: Bind the tag to the artifact it would publish
        # Runs FIRST of the real checks: a mismatched tag must cost seconds, not the ~20 minutes
        # the release pipeline takes. Exits non-zero, printing the tag and both package.json
        # values, when the tag disagrees with either.
        run: node scripts/check-publish-tag.mjs "${GITHUB_REF}"

      # F3 fix: release.mjs's prune-public-tree.mjs step used to be wired ONLY behind
      # SERPENS_PUBLIC_REPO_DIR, which nothing in this repository ever set — so a real, tagged
      # CI publish pruned nothing, silently, every time. This checks out the PUBLIC repository
      # (this same content, as published — the thing prune-public-tree.mjs actually prunes) into
      # `public-repo-checkout/`, a SUBDIRECTORY of `github.workspace` (`actions/checkout`'s
      # `path:` input is always resolved against `github.workspace`, the primary checkout's own
      # root — never a sibling of it) and points the release pipeline at it. `--apply` is
      # deliberately on: this runs only on a real, tag-triggered publish job, immediately before
      # `npm publish`, so pruning the public repo IS this release doing its job, not a dry
      # preview of it.
      #
      # D1 fix: a LOCAL delete with no commit and no push is not a fix — the retired file was
      # still sitting in the public repository after every "successful" run, and the log line
      # (`deleted N path(s)`) read as success while nothing durable had happened. `token:` here
      # is what makes the checkout below (and the commit+push step after the pipeline runs)
      # write-capable against `fresh-fx59/serpens-sdd`, a DIFFERENT repository than the one this
      # workflow lives in — `GITHUB_TOKEN` (scoped by the `permissions:` block above) cannot
      # reach it no matter how that block is set, so a dedicated PAT is required. See the
      # "Commit and push the prune" step below for exactly what the operator must set.
      - name: Check out the public repository for prune-public-tree.mjs
        uses: actions/checkout@v4
        with:
          repository: fresh-fx59/serpens-sdd
          path: public-repo-checkout
          token: ${{ secrets.SERPENS_SDD_PUBLIC_REPO_TOKEN }}

      - name: Run the full release pipeline
        # The gate that stops a stale kit shipping. It never publishes, pushes or tags itself —
        # committing/pushing the PRUNE's effect is the separate, explicit step right after this
        # one, not something release.mjs or prune-public-tree.mjs do on their own.
        # SERPENS_PUBLIC_REPO_DIR points prune-public-tree.mjs at the public checkout above,
        # inside `github.workspace` (matching kit-source.mjs's own resolution one level up from
        # `npm/`, i.e. this job's checked-out repository root).
        env:
          SERPENS_PUBLIC_REPO_DIR: ${{ github.workspace }}/public-repo-checkout
          SERPENS_PUBLIC_REPO_PRUNE_APPLY: '1'
        run: node scripts/release.mjs

      # D1 fix: makes the prune durable. prune-public-tree.mjs itself never commits or pushes —
      # same "the caller owns that" discipline release.mjs already documents for `npm publish` —
      # so this is that caller, and it is deliberately its own step (not folded into the
      # pipeline step above) so a diff-free run is visibly a no-op in the log rather than a
      # silent branch inside release.mjs.
      #
      # REQUIRED OPERATOR SETUP (this cannot self-provision — GitHub Actions repository secrets
      # are set in the GitHub repository UI, not through this vault's sops-based secrets
      # console, which only manages NixOS fleet-host secrets):
      #   1. Create a GitHub fine-grained personal access token (or a bot account's PAT) scoped
      #      to ONLY `fresh-fx59/serpens-sdd`, with "Contents: Read and write" repository
      #      permission and nothing else.
      #   2. In the repository that hosts THIS workflow, add it as an Actions repository secret
      #      named exactly `SERPENS_SDD_PUBLIC_REPO_TOKEN`
      #      (Settings → Secrets and variables → Actions → New repository secret).
      #   3. Until that secret is set, `secrets.SERPENS_SDD_PUBLIC_REPO_TOKEN` resolves to an
      #      empty string, the checkout above authenticates as an anonymous/read-only clone, and
      #      `git push` below fails loudly (non-zero exit, job fails) — it does NOT silently
      #      skip, so a missing secret cannot regress back to "logs success, prunes nothing".
      - name: Commit and push the prune to the public repository
        working-directory: public-repo-checkout
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "prune-public-tree.mjs made no changes this release — nothing to commit or push."
            exit 0
          fi
          git config user.name 'serpens-sdd release bot'
          git config user.email 'noreply@users.noreply.github.com'
          git add -A
          git commit -m "chore: prune files retired from the vault source (release ${GITHUB_REF_NAME})"
          git push origin HEAD:refs/heads/main

      - name: Publish to npm
        # No token, no auth environment variable, no registry credential line anywhere: the
        # OIDC identity requested at the top of this job is the entire credential. The package
        # is scoped, so --access public is what makes it a public publish rather than a refused
        # private one.
        run: npm publish --access public
